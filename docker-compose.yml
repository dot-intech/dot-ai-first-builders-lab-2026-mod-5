# Postgres efímero SOLO para tests de integración. No usar en producción.
# Las credenciales viven en .env (ignorado por git); ver .env.example.
#
# Levantar:  docker compose up -d --wait
# Migrar:    DATABASE_URL="$TEST_DATABASE_URL" pnpm exec drizzle-kit migrate
# Tests:     TEST_DATABASE_URL="..." pnpm test:integration
# Bajar:     docker compose down
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: nutrashot-postgres-test
    environment:
      POSTGRES_USER: ${TEST_DB_USER:?definir TEST_DB_USER en .env}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?definir TEST_DB_PASSWORD en .env}
      POSTGRES_DB: ${TEST_DB_NAME:?definir TEST_DB_NAME en .env}
    ports:
      # Solo loopback: la BD de test no debe quedar expuesta a la red.
      - "127.0.0.1:${TEST_DB_PORT:-55432}:5432"
    # Sin volumen: los datos viven en memoria y se pierden al bajar el contenedor.
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
